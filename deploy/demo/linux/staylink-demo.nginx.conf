# Include inside http {}. Replace DEMO_ placeholders with approved values.
# Bind only on the approved internal address via DEMO_BIND_IP, never a public listener.
log_format staylink_demo '$time_iso8601 $status $request_method $uri $request_time';
map $uri $staylink_demo_csp {
    ~*^/api(?:/|$) "";
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:";
}
server {
    listen DEMO_BIND_IP:443 ssl;
    server_name DEMO_FQDN;
    ssl_certificate DEMO_CERT_FILE;
    ssl_certificate_key DEMO_CERT_KEY_FILE;
    ssl_protocols TLSv1.2 TLSv1.3;
    root DEMO_WEB_ROOT;
    index index.html;
    access_log DEMO_ACCESS_LOG staylink_demo;
    # Avoid query strings in logs (Mailpit activation links contain a token).
    error_log DEMO_ERROR_LOG crit;
    client_max_body_size 29m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Maps use local fallback until JTIK authorizes any external tile sources.
    add_header Content-Security-Policy $staylink_demo_csp always;
    # Keep API paths, status codes, Origin, Set-Cookie and X-CSRF-Token end to end.
    location ~ ^/api(?:/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host DEMO_FQDN;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Staylink-Demo-Client $remote_addr;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_redirect off;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
