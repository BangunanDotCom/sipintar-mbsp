name: STAYLink Phase 1 checks

on:
  push:
    branches:
      - staylink-mbsp-phase1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staylink-phase1-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint and database-free tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      STAYLINK_DOCUMENT_STORE: disabled
      STAYLINK_CLAMAV_ENABLED: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Database integration tests require an isolated PostgreSQL _test database
      # and Mailpit; never run them against a production or unspecified database.
      - name: Run database-free tests
        run: npx vitest run --exclude tests/api.test.ts
