name: STAYLink branch checks

on:
  push:
    branches:
      - staylink-mbsp-phase1
  pull_request:
    branches:
      - main
      - staylink-mbsp-phase1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staylink-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --exclude tests/api.test.ts
      - name: Officer triage component regression tests
        run: npx vitest run tests/officer-document-triage-preview.test.tsx
      - name: Lint
        run: npm run lint
      - name: Production web build
        run: npm run build
