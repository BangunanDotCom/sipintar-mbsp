name: STAYLink agent task readiness

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing STAYLink task issue number'
        required: true
        type: number

permissions:
  contents: read
  issues: read

jobs:
  validate-task:
    name: Validate bounded task before agent handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate task content and risk
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const issueNumber = Number(process.env.ISSUE_NUMBER);
          if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) throw new Error('Invalid issue number');
          const url = `https://api.github.com/repos/${process.env.REPOSITORY}/issues/${issueNumber}`;
          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) throw new Error(`Unable to read issue: HTTP ${response.status}`);
          const issue = await response.json();
          if (issue.pull_request || issue.state !== 'open') throw new Error('An open issue is required');
          if (!issue.title?.startsWith('[STAYLink task]')) throw new Error('Use the STAYLink task template');
          const body = issue.body ?? '';
          const required = ['Objective and user benefit', 'Acceptance criteria', 'Files or modules in scope', 'Risk classification', 'Required controls'];
          for (const heading of required) {
            const marker = `### ${heading}\n`;
            const sectionStart = body.indexOf(marker);
            if (sectionStart < 0) throw new Error(`Missing required section: ${heading}`);
            const valueStart = sectionStart + marker.length;
            const nextSection = body.indexOf('\n### ', valueStart);
            const value = body.slice(valueStart, nextSection < 0 ? undefined : nextSection).trim();
            if (!value || value === '_No response_') throw new Error(`Empty required section: ${heading}`);
          }
          const risk = body.match(/### Risk classification\n([^\n]+)/)?.[1]?.trim() ?? '';
          if (!risk.startsWith('Low') && !risk.startsWith('Medium')) throw new Error('High or unknown risk requires manual review; no agent handoff');
          const controls = body.split('### Required controls\n')[1] ?? '';
          if ((controls.match(/- \[x\]/gi) ?? []).length < 3) throw new Error('All safety controls must be acknowledged');
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## STAYLink agent task readiness\nIssue #${issueNumber}: validated for human-supervised handoff.\nRisk: ${risk}.\n**No agent was started; no code was written or deployed.**\n`);
          console.log('Task readiness validation passed. No agent executed.');
          NODE
