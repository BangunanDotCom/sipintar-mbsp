name: STAYLink synthetic portal UAT

on:
  workflow_dispatch:
  push:
    branches:
      - 'issue-36-uat-ict-readiness'
      - 'issue-40-ict-acceptance'
      - 'issue-40-effect-advisory'
      - 'issue-45-policy-regression'
      - 'issue-49-ict-acceptance'
      - 'issue-54-ict-decision-pack'
      - 'issue-58-facilitator-handover'
      - 'issue-62-demo-release-readiness'
      - 'feature/cloudflare-demo-readiness'
      - 'feature/personal-demo'

permissions:
  contents: read

concurrency:
  group: staylink-synthetic-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --exclude tests/api.test.ts
      - run: npm run build
      - run: npm audit
      - name: Rehearse the Cloudflare origin boundary without provisioning
        run: bash scripts/rehearse-cloudflare-boundary.sh

  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browser, kit, demo, personal]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://staylink_fixture:staylink_fixture@127.0.0.1:5432/${{ matrix.suite == 'personal' && 'staylink_issue62_personal_ci_test' || matrix.suite == 'demo' && 'staylink_issue62_hosted_test' || format('staylink_issue58_{0}_test', matrix.suite) }}
      TEST_DATABASE_URL: postgresql://staylink_fixture:staylink_fixture@127.0.0.1:5432/${{ matrix.suite == 'personal' && 'staylink_issue62_personal_ci_test' || matrix.suite == 'demo' && 'staylink_issue62_hosted_test' || format('staylink_issue58_{0}_test', matrix.suite) }}
      APP_ORIGIN: ${{ matrix.suite == 'personal' && 'https://localhost:5444' || matrix.suite == 'demo' && 'https://localhost:5443' || 'http://localhost:5173' }}
      API_PORT: '3001'
      STAYLINK_DEMO_HOST: ${{ (matrix.suite == 'demo' || matrix.suite == 'personal') && 'true' || 'false' }}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_PRODUCTION_ENABLED: 'false'
      STAYLINK_DOCUMENT_STORE: disabled
      STAYLINK_LOCAL_DOCUMENT_STORE_ENABLED: 'false'
      STAYLINK_CLAMAV_ENABLED: 'false'
      STAYLINK_DOCUMENT_SCAN_BATCH_ENABLED: 'false'
      STAYLINK_SYNTHETIC_PORTAL: 'true'
      STAYLINK_SYNTHETIC_DISTRICT: SPU
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staylink_fixture
          POSTGRES_PASSWORD: staylink_fixture
          POSTGRES_DB: ${{ matrix.suite == 'personal' && 'staylink_issue62_personal_ci_test' || matrix.suite == 'demo' && 'staylink_issue62_hosted_test' || format('staylink_issue58_{0}_test', matrix.suite) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staylink_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Generate isolated fixture keys and officer identifiers
        run: |
          set -euo pipefail
          for key in MFA_ENCRYPTION_KEY IDENTITY_DATA_KEY STAYLINK_SYNTHETIC_CALLBACK_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          for key in STAYLINK_SYNTHETIC_PIC_ID STAYLINK_SYNTHETIC_SUPERVISOR_ID; do
            printf '%s=%s\n' "$key" "$(node -p 'crypto.randomUUID()')" >> "$GITHUB_ENV"
          done
      - name: Wait for isolated Mailpit
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8025/api/v1/messages >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify empty guided UAT database and loopback services
        if: matrix.suite == 'kit' || matrix.suite == 'demo' || matrix.suite == 'personal'
        env:
          NODE_ENV: development
        run: npm run uat:preflight -- empty
      - run: npm run db:test:migrate
      - run: npm run db:seed
      - name: Run PostgreSQL API integration tests
        if: matrix.suite == 'api'
        run: npx vitest run tests/api.test.ts
      - name: Rehearse backup and restore into a separate synthetic database
        if: matrix.suite == 'api'
        env:
          POSTGRES_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_FIXTURE_CONTAINER" psql -X -U staylink_fixture -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE staylink_issue58_restore_ci_test OWNER staylink_fixture'
          bash scripts/rehearse-synthetic-restore.sh "$POSTGRES_FIXTURE_CONTAINER" staylink_fixture staylink_issue58_api_test staylink_issue58_restore_ci_test
      - name: Install Playwright Chromium
        if: matrix.suite != 'api'
        run: npx playwright install --with-deps chromium
      - name: Run packaged demo over Nginx and TLS
        if: matrix.suite == 'demo' || matrix.suite == 'personal'
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          npm run build
          unset STAYLINK_SYNTHETIC_PIC_ID STAYLINK_SYNTHETIC_SUPERVISOR_ID STAYLINK_SYNTHETIC_CALLBACK_KEY
          node scripts/demo-host-readiness.mjs --prepare
          kit="$(npm run --silent db:uat-demo | sed -n 's/^Kit latihan ditulis ke //p')"
          test -f "$kit/portal.env"
          bash scripts/rehearse-demo-host.sh "$kit/portal.env"
      - name: Verify hosted demo backup and restore
        if: matrix.suite == 'demo'
        env:
          POSTGRES_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_FIXTURE_CONTAINER" psql -X -U staylink_fixture -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE staylink_issue62_restore_ci_test OWNER staylink_fixture'
          bash scripts/rehearse-synthetic-restore.sh "$POSTGRES_FIXTURE_CONTAINER" staylink_fixture staylink_issue62_hosted_test staylink_issue62_restore_ci_test
      - name: Run integrated browser UAT
        if: matrix.suite == 'browser' || matrix.suite == 'kit'
        shell: bash
        env:
          NODE_ENV: development
          UAT_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          if [[ "$UAT_SUITE" == kit ]]; then
            kit="$(npm run --silent db:uat-demo | sed -n 's/^Kit latihan ditulis ke //p')"
            test -f "$kit/accounts.json"
            unset STAYLINK_SYNTHETIC_PIC_ID STAYLINK_SYNTHETIC_SUPERVISOR_ID
            unset STAYLINK_SYNTHETIC_CALLBACK_KEY STAYLINK_SYNTHETIC_DISTRICT
            node --env-file="$kit/portal.env" scripts/uat-preflight.mjs kit --kit "$kit"
            source "$kit/portal.env"
            export STAYLINK_UAT_KIT_FILE="$kit/accounts.json"
          fi
          npx concurrently -k 'npm:dev:api' 'vite --config apps/web/vite.config.ts --host 127.0.0.1 --strictPort' &
          server=$!
          trap 'kill -TERM "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/api/health >/dev/null
          if [[ "$UAT_SUITE" == kit ]]; then
            npm run test:e2e -- tests/e2e/synthetic-portal.spec.ts
          else
            npm run test:e2e
          fi
